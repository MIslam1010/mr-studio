version: 2
# One grouped pull request per ecosystem and month, so updates arrive as a few reviewable batches instead of one
# pull request per package. Major versions of Python packages are skipped: the exact pins in requirements.txt are
# the ones the 510 validation checks were run with, so a major upgrade is a deliberate change, not a routine bump.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # toppra 0.6.10 publishes Linux wheels only (no macOS/Windows wheel, no sdist): the installers cannot use it
      - dependency-name: "toppra"
        versions: ["0.6.10"]
  - package-ecosystem: pip
    directory: /packaging
    schedule:
      interval: monthly
    groups:
      build-tools:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
