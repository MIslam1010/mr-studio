version: 2
# One grouped pull request per ecosystem and month, so updates arrive as a few reviewable batches instead of one
# pull request per package. Major versions of Python packages are skipped: the exact pins in requirements.txt are
# the ones the 510 validation checks were run with, so a major upgrade is a deliberate change, not a routine bump.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # toppra 0.6.6-0.6.10 publish Linux wheels only (no macOS/Windows wheel, no sdist): the installers cannot use them
      - dependency-name: "toppra"
        versions: [">0.6.3"]
      # sympy 1.14 (pinned) requires mpmath < 1.4
      - dependency-name: "mpmath"
        versions: [">=1.4"]
      # the validated maths core: a numpy/scipy minor upgrade is a deliberate change with a full re-validation
      - dependency-name: "numpy"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "contourpy"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: pip
    directory: /packaging
    schedule:
      interval: monthly
    groups:
      build-tools:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # toppra 0.6.6-0.6.10 publish Linux wheels only (no macOS/Windows wheel, no sdist): the installers cannot use them
      - dependency-name: "toppra"
        versions: [">0.6.3"]
      # sympy 1.14 (pinned) requires mpmath < 1.4
      - dependency-name: "mpmath"
        versions: [">=1.4"]
      # the validated maths core: a numpy/scipy minor upgrade is a deliberate change with a full re-validation
      - dependency-name: "numpy"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "scipy"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "contourpy"
        update-types: ["version-update:semver-minor"]
