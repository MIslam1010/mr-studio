# CI of MR Studio.
#   test    (every push and pull request, Ubuntu): ruff (syntax errors, undefined names) + the full pytest suite
#   build   (push to main/master, tags v*, manual run; NOT on pull requests): freezes the app with PyInstaller on
#           Windows and macOS, runs --self-test, --validate and a --screenshot smoke test on the FROZEN app, and
#           uploads the installers and reports:
#             Windows -> MR-Studio-<version>-Windows-x64-setup.exe (+ portable .zip)
#             macOS   -> MR-Studio-<version>-macOS-arm64.dmg
#   release (tags v*): attaches the installers + SHA256SUMS.txt to a GitHub Release with generated notes.
# Actions are pinned to full release tags (e.g. v4.2.2), not commit SHAs: SHAs could not be looked up when this file
# was written. Dependabot (.github/dependabot.yml) keeps them current; replace the tags by SHAs when convenient.
name: build installers

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen       # no display on CI machines
  MPLBACKEND: Agg
  PYTHONUTF8: "1"                  # tab titles use characters cp1252 cannot print (Windows)
  PYTHONIOENCODING: utf-8
  MRSTUDIO_SETTINGS: ${{ github.workspace }}/ci-settings.ini   # never touch real user settings

jobs:
  test:
    name: tests (ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Tag matches the version in packaging/bundle_config.py and pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="$(python3 packaging/bundle_config.py version)"
          p="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=${GITHUB_REF_NAME} bundle_config=${v} pyproject=${p}"
          test "${GITHUB_REF_NAME}" = "v${v}" && test "${v}" = "${p}"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Qt's "offscreen" platform cannot create OpenGL contexts on Linux, and the 3-D views need one: run the
      # tests on a virtual X server (Xvfb) with Mesa's software OpenGL instead.
      - name: System libraries for Qt (xcb), Xvfb and Mesa OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libegl1 libgl1-mesa-dri \
            libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xfixes0 libxcb-xkb1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (syntax errors and undefined names)
        run: ruff check .

      # Numerical and non-window tests only: Mesa's software OpenGL under Xvfb aborts when a 3-D view redraws.
      # Every GUI test runs on the Windows and macOS build jobs below (the platforms students use).
      - name: Run tests
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: "1"
          MRSTUDIO_NO_GUI_TESTS: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m pytest -q -ra --durations=15

  build:
    name: build (${{ matrix.os }})
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
        include:
          - os: windows-2022
            shell: bash -el {0}        # login shell: activates the conda environment of setup-miniconda
          - os: macos-14
            shell: bash                # NOT a login shell: macOS path_helper would put /usr/bin before setup-python
    env:
      CONDA_PKGS_DIR: ${{ github.workspace }}/.conda-pkgs      # cached below (Windows)
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # macOS: python.org Python 3.11 + pip (Pinocchio's `pin` wheel exists for macOS)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: runner.os == 'macOS'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r packaging/requirements-build.txt

      # Windows: Pinocchio has NO Windows wheel on PyPI -> conda-forge for Pinocchio and PySide6, pip for the rest
      - name: Cache conda packages and pip wheels (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            .conda-pkgs
            ~/AppData/Local/pip/Cache
          key: win-deps-${{ hashFiles('requirements.txt', 'packaging/requirements-build.txt', 'packaging/bundle_config.py') }}
          restore-keys: win-deps-

      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
        if: runner.os == 'Windows'
        with:
          miniforge-version: latest
          python-version: "3.11"
          activate-environment: mrstudio
          channels: conda-forge
          conda-remove-defaults: "true"

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          conda install -y -c conda-forge --override-channels $(python packaging/bundle_config.py conda-packages)
          python packaging/bundle_config.py windows-requirements requirements.txt packaging/build/requirements-windows.txt
          python -m pip install --upgrade pip
          python -m pip install -r packaging/build/requirements-windows.txt -r packaging/requirements-build.txt

      - name: Use Mesa software OpenGL (Windows runners have no GPU)
        if: runner.os == 'Windows'
        run: echo "QT_OPENGL=software" >> "$GITHUB_ENV"

      # Run the suite on the build OS too: Windows uses conda-forge Pinocchio/PySide6, which Linux never sees.
      - name: Run tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q -ra tests

      - name: Ensure Inno Setup is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }

      # The tests ran above; the build scripts still run --self-test on the frozen app.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File packaging/build_windows.ps1 -Python "$(python -c 'import sys; print(sys.executable)')" -NoInstall -SkipTests

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: PYTHON=python ./packaging/build_macos.sh --no-install --skip-tests

      # ---- validate the FROZEN app (not the source tree): a missing library or data file shows up here ----
      - name: Validate frozen app (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "packaging\dist\MRStudio\MRStudio.exe"
          $report = Join-Path $PWD "packaging\dist\validate-Windows.txt"
          $p = Start-Process -FilePath $exe -ArgumentList @("--validate", "--report", "`"$report`"") -Wait -PassThru -NoNewWindow
          if (Test-Path $report) { Get-Content $report | Select-Object -Last 15 }
          if ($p.ExitCode -ne 0) { throw "frozen --validate failed (exit code $($p.ExitCode))" }

      - name: Validate frozen app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: |
          "packaging/dist/MR Studio.app/Contents/MacOS/MRStudio" --validate --report "packaging/dist/validate-macOS.txt"
          tail -n 15 "packaging/dist/validate-macOS.txt"

      - name: Screenshot smoke test of the frozen app (14 tabs)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "packaging/dist/screenshots-${{ runner.os }}"
          if ($env:RUNNER_OS -eq "Windows") { $exe = Join-Path $PWD "packaging\dist\MRStudio\MRStudio.exe" }
          else { $exe = Join-Path $PWD "packaging/dist/MR Studio.app/Contents/MacOS/MRStudio" }
          $p = Start-Process -FilePath $exe -ArgumentList @("--screenshot", "`"$dir`"", "--delay", "800") -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "frozen --screenshot exited with code $($p.ExitCode)" }
          $png = @(Get-ChildItem -Path $dir -Filter *.png -ErrorAction SilentlyContinue)
          $empty = @($png | Where-Object { $_.Length -le 0 })
          Write-Host "$($png.Count) screenshots, $($empty.Count) empty"
          if ($png.Count -ne 14 -or $empty.Count -gt 0) { throw "expected 14 non-empty PNGs in $dir" }

      - name: Upload installers and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: MR-Studio-${{ runner.os }}
          path: |
            packaging/dist/*.dmg
            packaging/dist/*.exe
            packaging/dist/*.zip
            packaging/dist/self-test-*.txt
            packaging/dist/validate-*.txt
            packaging/dist/screenshots-*/*.png
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach installers to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: installers
          merge-multiple: true
      - name: SHA-256 checksums
        working-directory: installers
        run: |
          sha256sum *.dmg *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            installers/*.dmg
            installers/*.exe
            installers/*.zip
            installers/SHA256SUMS.txt
